markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
      linenums: false
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: dollar

# 加载官方 MathJax 脚本即可，不需要任何自定义 JS
extra_javascript:
  # 先加载你的 MathJax 配置
  - js/mathjax-config.js
  # 再加载 MathJax
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  # 顶栏「下载本页 PDF」按钮
  - assets/js/pdf-download.js

extra_css:
  # 打印 / 导出 PDF 时隐藏顶栏等装饰
  - assets/css/print-hide.css
  # 文章难度标签配色（入门→NOI/NOI+/CTS 共 8 级）
  - assets/css/difficulty.css
