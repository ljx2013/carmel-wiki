site_name: 塔尖 wiki
site_url: https://ljx2013.github.io/luogu-problem-wiki/
repo_url: https://github.com/ljx2013/luogu-problem-wiki
repo_name: luogu-problem-wiki

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - header.autohide
    # 不再使用 content.mathjax

nav:

  - 首页: index.md
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
      linenums: false
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: dollar

# 加载官方 MathJax 脚本即可，不需要任何自定义 JS
extra_javascript:
  # 先加载你的 MathJax 配置
  - js/mathjax-config.js
  # 再加载 MathJax
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# 不加载 KaTeX CSS/JS
# extra_css: …
