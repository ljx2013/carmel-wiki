site_name: Carmel-wiki
site_url: https://ljx2013.github.io/carmel-wiki/
repo_url: https://github.com/ljx2013/carmel-wiki
repo_name: carmel-wiki

theme:
  name: material
  language: zh
  # 主题覆盖目录：注入「难度标签」徽章（overrides/main.html）
  custom_dir: overrides
  logo: assets/images/logo.ico
  favicon: assets/images/logo.ico
  palette:
    # 白昼模式（橘色顶栏）
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: 切换到黑夜模式
    # 黑夜模式（橘色顶栏）
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: 切换到白昼模式
  features:
    - navigation.tabs
    - navigation.top
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - header.autohide
    # 不再使用 content.mathjax

