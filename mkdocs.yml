site_name: Carmel Wiki
site_url: https://ljx2013.github.io/carmel-wiki/
repo_url: https://github.com/ljx2013/carmel-wiki
repo_name: GitHub

hooks:
  - hooks/auto_page_count.py

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - header.autohide
    # 不再使用 content.mathjax
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 数学:
    - 数学符号: 数学 Math/数学符号 Math symbols.md
    - 集合: 数学 Math/集合 set.md
    - 模意义下的数和运算:
      - 取模: 模意义下的数和运算/取模 mod.md
      - 裴蜀定理: 模意义下的数和运算/裴蜀定理 Bezout identity.md
      - 中国剩余定理: 模意义下的数和运算/中国剩余定理 CRT.md
    - 方程:
      - 丢番图方程: 数学 Math/方程/丢番图方程.md
      - 不定方程: 数学 Math/方程/不定方程.md
    - 组合数学:
      - 排列组合: 组合数学/1. 排列组合.md
      - 二项式定理: 组合数学/2. 二项式定理.md
      - 容斥原理: 组合数学/3. 容斥原理.md
      - 鸽巢原理: 组合数学/4. 鸽巢原理.md
      - 卡特兰数: 组合数学/5. 卡特兰数.md
      - 递推关系: 组合数学/6. 递推关系.md
    - 数列:
      - 等差数列: 数列/等差数列.md
      - 等比数列: 数列/等比数列.md
      - 斐波那契数列: 数列/斐波那契数列.md
      - 斯特林数: 数列/斯特林数.md
    - 数论:
      - 素数与筛法: 数论/素数与筛法.md
      - 欧拉函数: 数论/欧拉函数.md
      - 威尔逊定理: 数论/威尔逊定理.md
      - 阶与原根: 数论/阶与原根.md
      - 莫比乌斯函数与莫比乌斯反演: 数论/莫比乌斯函数与莫比乌斯反演.md
    - 代数与多项式:
      - 韦达定理: 代数与多项式/韦达定理.md
      - 因式分解: 代数与多项式/因式分解.md
      - 多项式余数定理: 代数与多项式/多项式余数定理.md
    - 几何:
      - 向量基础: 几何/向量基础.md
      - 三角形面积与海伦公式: 几何/三角形面积与海伦公式.md


markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
      linenums: false
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: dollar

extra_javascript:
  # 先加载你的 MathJax 配置
  - js/mathjax-config.js
  # 再加载 MathJax
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  # 首页「已收录 X 条页面」计数动画
  - js/page-counter.js
  # 导出 PDF 按钮
  - js/export-pdf.js

extra_css:
  - css/theme-color.css
  - css/palette-transition.css
  - css/page-counter.css
  - css/export-pdf.css
