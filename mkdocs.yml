site_name: Carmel-wiki
site_url: https://ljx2013.github.io/carmel-wiki/
repo_url: https://github.com/ljx2013/carmel-wiki
repo_name: carmel-wiki

theme:
  name: material
  language: zh
  # 主题覆盖目录：注入「难度标签」徽章（overrides/main.html）
  custom_dir: overrides
  logo: assets/images/logo.ico
  favicon: assets/images/logo.ico
  palette:
    # 白昼模式（橘色顶栏）
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: 切换到黑夜模式
    # 黑夜模式（橘色顶栏）
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: 切换到白昼模式
  features:
    - navigation.tabs
    - navigation.top
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - header.autohide
    # 不再使用 content.mathjax

nav:
  - 首页: index.md
  - 笔记:
    - 前置知识:
      - freopen的使用: 笔记/前置知识/freopen的使用.md
      - 关闭输入输出流: 笔记/前置知识/关闭输入输出流.md
    - 数学:
      - 加法: 笔记/数学/加法.md
      - 欧几里得算法与扩展欧几里得: 笔记/数学/欧几里得算法与扩展欧几里得.md
    - 理论:
      - 时间与空间复杂度: 笔记/理论/时间与空间复杂度.md
    - 算法:
      - 二分答案: 笔记/算法/二分答案.md
  - 题解:
    - 2026-10-03 CSP-J模拟赛 题解:
      - 幸运号码（lucky）: 题解/2026-10-03 CSP-J模拟赛 题解/幸运号码（lucky）.md
      - 序列（seq）: 题解/2026-10-03 CSP-J模拟赛 题解/序列（seq）.md
      - 自动售货机（vending）: 题解/2026-10-03 CSP-J模拟赛 题解/自动售货机（vending）.md
      - 食堂打饭（canteen）: 题解/2026-10-03 CSP-J模拟赛 题解/食堂打饭（canteen）.md
    - 2026-10-04 CSP-J模拟赛 题解:
      - 会议室安排（meeting）: 题解/2026-10-04 CSP-J模拟赛 题解/会议室安排（meeting）.md
      - 文本编辑器（editor）: 题解/2026-10-04 CSP-J模拟赛 题解/文本编辑器（editor）.md
      - 日历推算（calendar）: 题解/2026-10-04 CSP-J模拟赛 题解/日历推算（calendar）.md
      - 补给站规划（supply）: 题解/2026-10-04 CSP-J模拟赛 题解/补给站规划（supply）.md
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
      linenums: false
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: dollar

# 加载官方 MathJax 脚本即可，不需要任何自定义 JS
extra_javascript:
  # 先加载你的 MathJax 配置
  - js/mathjax-config.js
  # 再加载 MathJax
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  # 顶栏「下载本页 PDF」按钮
  - assets/js/pdf-download.js

extra_css:
  # 打印 / 导出 PDF 时隐藏顶栏等装饰
  - assets/css/print-hide.css
  # 文章难度标签配色（入门→NOI/NOI+/CTS 共 8 级）
  - assets/css/difficulty.css
