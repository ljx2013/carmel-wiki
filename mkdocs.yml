site_name: Carmel-wiki
site_url: https://ljx2013.github.io/carmel-wiki/
repo_url: https://github.com/ljx2013/carmel-wiki
repo_name: carmel-wiki

theme:
  name: material
  language: zh
  logo: assets/images/logo.ico
  favicon: assets/images/logo.ico
  palette:
    # 白昼模式（橘色顶栏）
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: 切换到黑夜模式
    # 黑夜模式（橘色顶栏）
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: 切换到白昼模式
  features:
    - navigation.tabs
    - navigation.top
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - header.autohide
    # 不再使用 content.mathjax

nav:
  - 首页: index.md
  - 笔记:
    - freopen的使用: 笔记/freopen的使用.md
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
      linenums: false
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: dollar

# 加载官方 MathJax 脚本即可，不需要任何自定义 JS
extra_javascript:
  # 先加载你的 MathJax 配置
  - js/mathjax-config.js
  # 再加载 MathJax
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  # 顶栏「下载本页 PDF」按钮
  - assets/js/pdf-download.js

extra_css:
  # 打印 / 导出 PDF 时隐藏顶栏等装饰
  - assets/css/print-hide.css
